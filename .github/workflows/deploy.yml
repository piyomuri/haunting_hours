name: Deploy Haunting Hours Website
on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: 'deploy-haunting-hours'
  cancel-in-progress: true

job:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload build files
        uses: actions/upload-pages-artifact@v5
        with:
          name: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5